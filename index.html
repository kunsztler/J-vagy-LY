<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J vagy LY?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><img src="matekmozgas-logo.png" alt="MatekMozgás"></div>
  <div class="top-actions">
    <div class="timer" id="totalTimer">05:00</div>
    <button class="icon-btn" id="soundBtn" title="Hang be/ki">🔊</button>
    <button class="icon-btn" id="fullscreenBtn" title="Teljes képernyő">⛶</button>
    <button class="icon-btn" id="settingsBtn" title="Beállítások">⚙️</button>
  </div>
</header>
<div class="layout">
<aside class="sidebar">
  <h2>🎮 Játék választása</h2>
  <button class="game-select active">🔤 J vagy LY? ✓</button>
  <button class="game-select locked">🔒 Igaz vagy hamis</button>
  <button class="game-select locked">🔒 Hosszú vagy rövid?</button>
  <button class="game-select locked">🔒 Egybe vagy külön?</button>
  <button class="game-select locked">🔒 Melyik a helyes?</button>
  <button class="game-select locked">🔒 Szóvadász</button>
</aside>
<main class="main">
<section class="game-card">
  <h1 class="game-title">J vagy LY?</h1>
  <div class="problem-wrap">
    <div class="problem word-problem">
      <div class="word-prefix" id="wordPrefix">gó</div>
      <div class="operator" id="op">?</div>
      <div class="word-suffix" id="wordSuffix">a</div>
    </div>
    <div class="countdown" id="countdown">Kezdéshez nyomd meg a gombot!</div>
  </div>
  <div class="result" id="result">
    <div class="result-answer" id="resultAnswer">J</div>
    <div class="result-label" id="resultLabel">HELYES!</div>
  </div>
  <div class="rules">
    <div class="rule odd choice-card"><img src="guggolas.png" alt="J – csípőretartás"></div>
    <div class="rule even choice-card"><img src="ugras.png" alt="LY – rézsútos magastartás"></div>
  </div>
  <div class="controls">
    <button class="primary" id="startBtn">▶️ Játék indítása</button>
    <button class="secondary hidden" id="stopBtn">⏹️ Játék vége</button>
  </div>
</section>
</main>
</div>
</div>
<div class="overlay" id="overlay">
  <div class="settings-box">
    <button class="close-x" id="closeX" title="Bezárás">×</button>
    <h2>⚙️ Beállítások</h2>
    <div class="setting-row"><label><span>⏱️ Játékidő</span><span id="gameTimeText">5 perc</span></label><input class="range" id="gameTime" type="range" min="1" max="10" value="5"></div>
    <div class="setting-row"><label><span>⏳ Gondolkodási idő</span><span id="thinkingTimeText">5 másodperc</span></label><input class="range" id="thinkingTime" type="range" min="1" max="10" value="5"></div>
    <button class="close-btn" id="closeSettings">Kész</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
